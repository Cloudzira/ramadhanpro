    *{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font:15px/1.55 var(--sans);background:radial-gradient(ellipse at 75% -18%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 40%),linear-gradient(135deg,transparent 65%,rgba(255,255,255,.018)),var(--bg)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;background:rgba(16,27,25,.72);backdrop-filter:blur(16px);z-index:5}.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 30px}.brand-mark{width:39px;height:39px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:21px}.brand-title{font:800 16px var(--display);letter-spacing:0}.brand-sub{font-size:11px;color:var(--muted)}.nav-label{margin:8px 10px 9px;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:6px;padding:11px 12px;color:var(--muted);background:transparent;text-align:left;font-weight:600;transition:background .18s,color .18s}.nav button:hover,.nav button.active{background:var(--accent-soft);color:var(--accent)}.nav-icon{width:19px;height:19px;display:grid;place-items:center;font-size:17px}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;color:var(--muted);font-size:12px}.side-foot strong{display:block;color:var(--text);font-size:13px;font-weight:600}.main{width:min(1120px,100%);margin:auto;padding:28px 40px 70px}.topbar{display:flex;align-items: padding:10px 11px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-size:13px}.task input{accent-color:var(--accent);width:17px;height:17px;margin:0;flex:none}.task:has(input:checked){color:var(--muted)}.task:has(input:checked) span{text-decoration:line-through;text-decoration-color:var(--line)}.stat-line{display:flex;align-items:baseline;gap:7px}.stat-line strong{font:700 26px var(--display);color:var(--accent)}.stat-line span{font-size:12px;color:var(--muted)}.water{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:12px 0}.water button{height:37px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:11px;color:var(--muted)}.water button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}.water-labels{display:grid;grid-template-columns:2fr 4fr 2fr;color:var(--muted);font-size:10px;text-align:center}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field>span{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea,.text-input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:10px 11px}.field textarea{min-height:100px;resize:vertical}.field input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}.inline-field{display:flex;align-items:center;gap:9px}.inline-field span{font-size:13px}.field-help{font-size:11px;color:var(--muted)}.section-title{margin:27px 0 11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title h2{margin:0}.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.number-stepper{display:flex;align-items:center;gap:7px}.number-stepper input{width:72px;text-align:center}.number-stepper button{width:35px;height:35px;border:1px solid var(--line);background:var(--bg);border-radius:5px}.calendar-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.day-cell{border:1px solid var(--line);border-radius:5px;background:var(--bg);min-height:66px;padding:8px 4px;text-align:center;color:var(--muted);font-size:10px}.day-cell b{display:block;color:var(--text);font-size:14px;margin:5px 0}.day-cell.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}.quote{font:italic 16px/1.6 var(--serif);color:var(--text)}.quote small{display:block;margin-top:8px;color:var(--accent);font:600 11px var(--sans)}.chart{height:150px;display:flex;align-items:flex-end;gap:8px;padding-top:12px}.chart-col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;color:var(--muted);font-size:10px}.chart-col i{width:min(100%,35px);min-height:2px;background:var(--accent);border-radius:4px 4px 0 0}.chart-col b{font-size:9px;font-weight:500}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:4px 9px;color:var(--muted);font-size:11px}.notice{border-left:2px solid var(--accent);padding:10px 12px;background:var(--accent-soft);color:var(--muted);font-size:12px;border-radius:0 5px 5px 0}.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.list-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border:0}.list-row p{margin:0;font-size:13px}.empty{color:var(--muted);font-size:13px;padding:12px 0}.bottom-nav{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;transition:.2s;z-index:20;padding:10px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);box-shadow:0 8px 28px #0005;font-size:13px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.enter{animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:900px){.shell{grid-template-columns:205px minmax(0,1fr)}.main{padding:24px}.span-8,.span-7{grid-column:span 12}.span-5,.span-4{grid-column:span 6}}
    @media(max-width:650px){.shell{display:block}.sidebar{display:none}.main{padding:18px 15px 95px}.topbar{margin-bottom:20px}.topbar .date-label{font-size:11px}.hero{grid-template-columns:1fr;padding:22px;gap:14px}.hero-right{justify-self:start;text-align:left;display:flex;align-items:center;gap:10px}.count{font-size:37px}.count-caption{margin:0;max-width:150px;text-align:left}.hero:after{right:-95px;top:-112px}.grid{gap:10px;margin-top:10px}.panel{padding:15px}.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}.prayer-list{gap:5px}.prayer-item{padding:9px 3px}.prayer-item span{font-size:10px}.prayer-item b{font-size:12px}.check-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.bottom-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;padding:7px 6px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);z-index:10}.bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:2px;padding:3px}.bottom-nav button.active{color:var(--accent)}.bottom-nav i{font-style:normal;font-size:18px}.calendar-strip{gap:4px}.day-cell{font-size:9px;min-height:58px}.day-cell b{font-size:12px}.section-title{margin-top:22px}.page-head{align-items:flex-start;flex-direction:column}.water{gap:4px}.water button{height:34px;padding:0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigasi utama">
      <div class="brand"><div class="brand-mark" aria-hidden="true">☾</div><div><div class="brand-title">RamadhanPro</div><div class="brand-sub">Temani setiap fase</div></div></div>
      <div class="nav-label">Perjalanan</div><nav class="nav" id="side-nav"></nav>
      <div class="side-foot"><strong id="profile-name">Sahabat</strong><span>Catatanmu tersimpan privat di perangkat ini.</span></div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" id="mobile-nav" aria-label="Navigasi utama"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    'use strict';
    const KEY='ramadhanpro-v1';
    const NAV=[['home','⌂','Ringkasan'],['daily','✓','Mutabaah'],['plan','▦','Rencana'],['report','⌁','Rapor'],['settings','⚙','Pengaturan']];
    const PRAYERS=['Subuh','Dzuhur','Ashar','Maghrib','Isya'];
    const HABITS=['Shalat Subuh berjamaah','Tilawah Al-Qur’an','Sedekah harian'];
    const PREP_CHECKS=['Menghubungi orang tua dan keluarga','Menyelesaikan kewajiban finansial','Menyiapkan perlengkapan ibadah','Menetapkan waktu istirahat yang cukup'];
    const RAMADAN_TASKS=['Rawatib','Dhuha','Tarawih','Witir','Zikir pagi dan petang','Doa berbuka','Sedekah hari ini'];
    const quoteBank=[['Sebaik-baik bekal adalah takwa.','QS. Al-Baqarah: 197'],['Amalan yang paling dicintai Allah adalah yang terus-menerus, meski sedikit.','HR. Bukhari dan Muslim'],['Ingatlah, hanya dengan mengingat Allah hati menjadi tenteram.','QS. Ar-Ra’d: 28'],['Sesungguhnya bersama kesulitan ada kemudahan.','QS. Al-Insyirah: 6']];
    const defaults={settings:{ramadanStart:'2027-02-08',qadhaOwed:0,qadhaDone:0,qadhaDeadline:'2027-02-07',quranGoal:30,sadaqahGoal:0,zakatFitrah:45000,nisab:85000000,displayName:'Sahabat',city:''},days:{},fasting:{preRamadan:[],syawal:[]},prepDone:[],duas:[],family:[],habits:{},iktikaf:false};
    function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');return saved?{...structuredClone(defaults),...saved,settings:{...defaults.settings,...saved.settings},days:saved.days||{},fasting:saved.fasting||structuredClone(defaults.fasting)}:structuredClone(defaults)}catch{return structuredClone(defaults)}}
    let db=load(),view='home',selectedDate=keyOf(new Date()),toastTimer;
    function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{notify('Penyimpanan perangkat penuh. Unduh cadangan data.')}}
    function keyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function dayRecord(k=selectedDate){return db.days[k] ||= {prayers:Array(5).fill(false),tasks:{},pages:0,sadaqah:0,water:[false,false,false,false,false,false,false,false],fast:false,mood:0,note:'',dua:''}}
    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function dateDiff(a,b){const x=new Date(`${a}T12:00:00`),y=new Date(`${b}T12:00:00`);return Math.round((y-x)/86400000)}
    function phaseInfo(){const n=keyOf(new Date()),delta=dateDiff(db.settings.ramadanStart,n);if(delta<0)return{key:'prep',label:'Persiapan • Sya’ban',title:'Siapkan ruang untuk Ramadhan.',detail:`${-delta} hari menuju perkiraan awal Ramadhan`,day:0};if(delta<10)return{key:'ramadan',label:'Ramadhan • Rahmat',title:'Bangun kebiasaan yang bertahan.',detail:`Hari ${delta+1} Ramadhan`,day:delta+1};if(delta<20)return{key:'ramadan',label:'Ramadhan • Maghfirah',title:'Jaga ritme, beri ruang untuk pulih.',detail:`Hari ${delta+1} Ramadhan`,day:delta+1};if(delta<30)return{key:'last',label:'Ramadhan • 10 malam terakhir',title:'Lapangkan waktu untuk ibadah malam.',detail:`Hari ${delta+1} Ramadhan`,day:delta+1};if(delta<33)return{key:'eid',label:'Syawal • Hari Raya',title:'Rayakan kemenangan dengan syukur.',detail:`Hari ${delta-29} Syawal`,day:delta-29};return{key:'post',label:'Syawal • Istiqamah',title:'Rawat kebiasaan baikmu.',detail:'Perjalanan berlanjut setelah Ramadhan',day:0}}
    function todayScore(r=dayRecord(keyOf(new Date()))){const total=r.prayers.length+RAMADAN_TASKS.length+1,done=r.prayers.filter(Boolean).length+RAMADAN_TASKS.filter((_,i)=>r.tasks[i]).length+(r.pages>0?1:0);return Math.round(done/total*100)}
    function streak(){let date=new Date(),count=0;if(!db.days[keyOf(date)]||todayScore(db.days[keyOf(date)])===0)date.setDate(date.getDate()-1);while(db.days[keyOf(date)]&&todayScore(db.days[keyOf(date)])>0){count++;date.setDate(date.getDate()-1)}return count}
    function navHTML(){return NAV.map(([id,icon,label])=>`<button data-view="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}><i class="nav-icon" aria-hidden="true">${icon}</i><span>${label}</span></button>`).join('')}
    function taskHTML(label,checked,action,value=''){return `<label class="task"><input type="checkbox" data-action="${action}" ${value!==''?`data-value="${value}"`:''} ${checked?'checked':''}><span>${esc(label)}</span></label>`}
    function scheduleCard(){let schedule=null;try{schedule=JSON.parse(localStorage.getItem('rp-prayer-cache')||'null')}catch{}if(!schedule)return `<section class="panel span-7"><div class="panel-head"><h2>Jadwal shalat & imsak</h2><span class="pill">Lokasi opsional</span></div><p class="muted small">Muat jadwal berdasarkan lokasimu. Izin lokasi diminta hanya saat kamu memilihnya.</p><button class="btn" data-view="settings">Atur jadwal di Pengaturan</button></section>`;const rows=[['Imsak',schedule.Imsak],['Subuh',schedule.Fajr],['Dzuhur',schedule.Dhuhr],['Ashar',schedule.Asr],['Maghrib',schedule.Maghrib],['Isya',schedule.Isha]];return `<section class="panel span-7"><div class="panel-head"><h2>Jadwal shalat & imsak</h2><button class="link-btn" data-view="settings">Perbarui →</button></div><div class="prayer-list" style="grid-template-columns:repeat(3,1fr)">${rows.map(([name,time])=>`<div class="prayer-item"><span>${name}</span><b>${esc(time||'—')}</b></div>`).join('')}</div><p class="muted small" style="margin:10px 0 0">${schedule.date===keyOf(new Date())?'Diperbarui hari ini':'Jadwal tersimpan tanggal '+esc(schedule.date||'')} · periksa kembali ke masjid atau otoritas setempat.</p></section>`}
    function shellPage(title,subtitle,body){return `<header class="topbar"><div class="date-label">${new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</div><div class="top-actions"><button class="icon-btn" data-action="install" aria-label="Pasang aplikasi" title="Pasang aplikasi">⇩</button><button class="icon-btn" data-view="settings" aria-label="Pengaturan" title="Pengaturan">⚙</button></div></header><div class="page-head"><div><div class="eyebrow">${esc(title)}</div><h1>${esc(subtitle)}</h1></div></div>${body}`}
    function home(){const p=phaseInfo(),score=todayScore(),r=dayRecord(keyOf(new Date())),left=dateDiff(keyOf(new Date()),db.settings.ramadanStart),quote=quoteBank[Math.floor(Date.now()/86400000)%quoteBank.length];document.documentElement.dataset.phase=p.key;return shellPage(p.label,p.title,`<section class="hero"><div><div class="eyebrow">Ramadan Journey 360</div><p class="intro">${esc(p.detail)}${p.day?` · Hari ${p.day}`:''}. Satu langkah kecil hari ini cukup berarti.</p><button class="btn primary" data-view="daily">${score?'Lanjutkan mutabaah':'Mulai mutabaah hari ini'}　→</button></div><div class="hero-right"><div class="count">${left>0?left:(p.day||'∞')}</div><div class="count-caption">${left>0?'hari menuju tanggal awal yang kamu pilih':p.day?'hari dalam fase ini':'hari istiqamah'}</div></div></section><div class="grid"><section class="panel span-5"><div class="panel-head"><h2>Ringkasan hari ini</h2><span class="pill">${esc(p.detail)}</span></div><div class="progress-row"><div class="progress-ring" style="--pct:${score}" data-label="${score}%" role="img" aria-label="${score} persen tercapai"></div><div class="progress-copy"><strong>${streak()} hari konsisten</strong><span>${score?`${score}% checklist tercatat`:'Mulai dari satu amalan'}</span></div></div><div class="progress-track"><i style="width:${score}%"></i></div></section><section class="panel span-7"><div class="panel-head"><h2>Shalat fardhu</h2><button class="link-btn" data-view="daily">Buka mutabaah →</button></div><div class="prayer-list">${PRAYERS.map((name,i)=>`<button class="prayer-item ${r.prayers[i]?'done':''}" data-action="prayer" data-value="${i}" aria-pressed="${r.prayers[i]}"><span>${name}</span><b>${r.prayers[i]?'Tercatat':'Belum'}</b></button>`).join('')}</div></section>${scheduleCard()}<section class="panel span-5"><div class="panel-head"><h2>Fokus fase ini</h2><span class="pill">${p.key==='prep'?'Pemanasan':p.key==='last'?'Malam ganjil':'Konsisten'}</span></div>${p.key==='prep'?`<p class="muted small">Catat qadha puasa, tuntaskan persiapan, lalu tetapkan niat Ramadhanmu.</p><div class="row-actions"><button class="btn" data-view="plan">Buka rencana pra-Ramadhan</button><span class="muted small">${db.settings.qadhaOwed-db.settings.qadhaDone} qadha tersisa</span></div>`:p.key==='last'?`<p class="muted small">Simpan doa pribadi dan tandai malam iktikaf tanpa kehilangan catatan.</p><div class="row-actions"><button class="btn" data-view="plan">Buka jurnal doa</button><span class="pill">${db.duas.length} doa tersimpan</span></div>`:p.key==='eid'||p.key==='post'?`<p class="muted small">Lanjutkan puasa Syawal dan kebiasaan yang ingin kamu jaga.</p><button class="btn" data-view="plan">Buka amalan Syawal</button>`:`<div class="stat-line"><strong>${r.pages}</strong><span>halaman Qur’an hari ini</span></div><p class="muted small">Target ${db.settings.quranGoal} juz · progres membantu mengukur ritme, bukan menilai diri.</p><button class="btn" data-view="daily">Catat amalan hari ini</button>`}</section><section class="panel span-5"><div class="panel-head"><h2>Hidrasi 2–4–2</h2><span class="pill">${r.water.filter(Boolean).length}/8 gelas</span></div><div class="water">${r.water.map((on,i)=>`<button data-action="water" data-value="${i}" class="${on?'on':''}" aria-label="Tandai gelas ${i+1}" aria-pressed="${on}">${on?'✓':i+1}</button>`).join('')}</div><div class="water-labels"><span>Sahur · 2</span><span>Berbuka · 4</span><span>Malam · 2</span></div></section><section class="panel span-12"><div class="panel-head"><h2>Pengingat hari ini</h2><button class="link-btn" data-view="plan">Jelajahi fitur →</button></div><div class="grid" style="margin:0"><div class="span-4"><div class="quote">“${esc(quote[0])}<small>${esc(quote[1])}</small></div></div><div class="span-4"><div class="eyebrow">Keseimbangan</div><p class="muted small">Catat secukupnya. Nilai progres sebagai pengingat pribadi, bukan pembanding dengan orang lain.</p></div><div class="span-4"><div class="eyebrow">Privasi</div><p class="muted small">Data tersimpan di browser ini. Gunakan cadangan di Pengaturan sebelum mengganti perangkat.</p></div></div></section></div>`)}
    function daily(){const r=dayRecord(),phase=phaseInfo();document.documentElement.dataset.phase=phase.key;return shellPage('Mutabaah yaumiyah','Ibadah harianmu',`<div class="panel"><div class="form-grid"><label class="field"><span>Tanggal jurnal</span><input type="date" data-action="date" value="${selectedDate}" max="${keyOf(new Date())}"></label><label class="field"><span>Suasana hati (opsional)</span><select data-action="mood"><option value="0">Pilih suasana</option>${['Berat','Kurang baik','Biasa','Baik','Tenang'].map((m,i)=>`<option value="${i+1}" ${r.mood===i+1?'selected':''}>${m}</option>`).join('')}</select></label></div><div class="section-title"><h2>Shalat fardhu</h2><span class="muted small">Tandai setelah menunaikan</span></div><div class="check-grid">${PRAYERS.map((n,i)=>taskHTML(n,r.prayers[i],'prayer',i)).join('')}</div><div class="section-title"><h2>Amalan sunnah dan harian</h2></div><div class="check-grid">${RAMADAN_TASKS.map((n,i)=>taskHTML(n,r.tasks[i],'task',i)).join('')}${taskHTML('Puasa sunnah hari ini',r.fast,'fast')}</div><div class="section-title"><h2>Tilawah Al-Qur’an</h2><span class="muted small">Target ${db.settings.quranGoal} juz</span></div><div class="row-actions"><div class="number-stepper"><button data-action="pages-step" data-value="-1" aria-label="Kurangi halaman">−</button><input class="text-input" type="number" min="0" max="1000" value="${r.pages}" data-action="pages" aria-label="Halaman dibaca"><button data-action="pages-step" data-value="1" aria-label="Tambah halaman">+</button></div><span class="muted small">halaman dibaca</span><label class="field" style="max-width:150px"><span>Juz selesai</span><input type="number" min="0" max="30" value="${r.juz||0}" data-action="juz"></label></div><div class="section-title"><h2>Sedekah</h2></div><label class="field" style="max-width:250px"><span>Nominal (Rp)</span><input type="number" min="0" step="1000" value="${r.sadaqah||0}" data-action="sadaqah"></label><div class="section-title"><h2>Hidrasi 2–4–2</h2><span class="muted small">${r.water.filter(Boolean).length} dari 8 gelas</span></div><div class="water">${r.water.map((on,i)=>`<button data-action="water" data-value="${i}" class="${on?'on':''}" aria-pressed="${on}">${on?'✓':i+1}</button>`).join('')}</div><div class="water-labels"><span>Sahur</span><span>Setelah berbuka</span><span>Malam</span></div><div class="section-title"><h2>Jurnal singkat</h2></div><label class="field"><span>Syukur, doa, atau refleksi hari ini</span><textarea data-action="note" placeholder="Tulis hanya yang ingin kamu simpan…">${esc(r.note)}</textarea></label><p class="muted small" style="margin:11px 0 0">Perubahan tersimpan otomatis di perangkat ini.</p></div>`)}
    function prepPlan(){const remain=Math.max(0,Number(db.settings.qadhaOwed)-Number(db.settings.qadhaDone)),deadline=db.settings.qadhaDeadline,daysLeft=Math.max(1,dateDiff(keyOf(new Date()),deadline)+1),dailyTarget=remain?Math.ceil(remain/daysLeft):0;return `<section class="panel"><div class="panel-head"><h2>Qadha puasa</h2><span class="pill">${remain} hari tersisa</span></div><p class="muted small">Buat target pelunasan sesuai kemampuan dan tenggat yang kamu tetapkan sendiri.</p><div class="form-grid"><label class="field"><span>Jumlah utang puasa</span><input type="number" min="0" max="365" data-setting="qadhaOwed" value="${db.settings.qadhaOwed}"></label><label class="field"><span>Sudah dibayar</span><input type="number" min="0" max="365" data-setting="qadhaDone" value="${db.settings.qadhaDone}"></label><label class="field"><span>Tanggal target</span><input type="date" data-setting="qadhaDeadline" value="${deadline}"></label></div><div class="notice" style="margin-top:13px">${remain?`Perkiraan target: ${dailyTarget} hari puasa per hari kalender sampai tenggat.`:'Qadha tercatat selesai.'} Atur ulang target bila tidak sesuai kemampuanmu.</div><div class="progress-track"><i style="width:${db.settings.qadhaOwed?Math.min(100,db.settings.qadhaDone/db.settings.qadhaOwed*100):0}%"></i></div></section><div class="section-title"><h2>Latihan puasa Sya’ban</h2><span class="muted small">${db.fasting.preRamadan.length} hari tercatat</span></div><section class="panel"><label class="field"><span>Tanggal puasa sunnah</span><input type="date" data-action="fast-date" max="${keyOf(new Date())}"></label><div class="list-row"><p>Senin–Kamis dan Ayyamul Bidh</p><span class="pill">${db.fasting.preRamadan.length} hari</span></div>${fastingCalendar('preRamadan')}</section><div class="section-title"><h2>Persiapan hati dan rencana</h2></div><section class="panel"><div class="check-grid">${PREP_CHECKS.map((n,i)=>taskHTML(n,db.prepDone.includes(i),'prep',i)).join('')}</div><div class="section-title"><h2>Visi Ramadhan</h2></div><div class="form-grid"><label class="field"><span>Target khatam (juz)</span><input type="number" min="1" max="30" data-setting="quranGoal" value="${db.settings.quranGoal}"></label><label class="field"><span>Target sedekah (Rp)</span><input type="number" min="0" step="10000" data-setting="sadaqahGoal" value="${db.settings.sadaqahGoal}"></label><label class="field"><span>Awal Ramadhan perkiraan</span><input type="date" data-setting="ramadanStart" value="${db.settings.ramadanStart}"></label></div></section>`}
    function fastingCalendar(kind){const dates=db.fasting[kind]||[];if(!dates.length)return '<p class="empty">Belum ada tanggal puasa tercatat.</p>';return `<div class="list-row"><p>Tanggal tersimpan</p><div class="row-actions">${dates.slice().sort().map(d=>`<span class="pill">${new Date(`${d}T12:00:00`).toLocaleDateString('id-ID',{day:'numeric',month:'short'})} <button class="link-btn" data-action="fast-remove" data-kind="${kind}" data-date="${d}" aria-label="Hapus tanggal ${d}">×</button></span>`).join('')}</div></div>`}
    function zakat(){const fitrah=Number(db.settings.zakatFitrah)||0,nisab=Number(db.settings.nisab)||0;return `<section class="panel"><div class="panel-head"><h2>Kalkulator zakat</h2><span class="pill">Perkiraan, konfirmasi ke amil</span></div><div class="form-grid"><label class="field"><span>Zakat fitrah per orang (Rp)</span><input type="number" min="0" step="1000" data-setting="zakatFitrah" value="${fitrah}"></label><label class="field"><span>Jumlah jiwa</span><input type="number" min="1" value="${db.settings.dependents||1}" data-setting="dependents"></label><label class="field"><span>Harta untuk zakat maal (Rp)</span><input type="number" min="0" step="100000" data-setting="wealth" value="${db.settings.wealth||0}"></label><label class="field"><span>Nisab yang digunakan (Rp)</span><input type="number" min="0" step="100000" data-setting="nisab" value="${nisab}"></label></div><div class="grid"><div class="panel span-6" style="margin-top:14px"><div class="eyebrow">Estimasi zakat fitrah</div><div class="stat-line"><strong>Rp ${(fitrah*(Number(db.settings.dependents)||1)).toLocaleString('id-ID')}</strong></div></div><div class="panel span-6" style="margin-top:14px"><div class="eyebrow">Estimasi zakat maal 2,5%</div><div class="stat-line"><strong>Rp ${(Number(db.settings.wealth)>=nisab?Number(db.settings.wealth)*.025:0).toLocaleString('id-ID')}</strong></div></div></div><p class="notice" style="margin:14px 0 0">Perhitungan ini alat bantu sederhana, bukan fatwa. Pastikan nisab, haul, nilai bahan pokok, dan waktu pembayaran sesuai panduan amil setempat.</p></section>`}
    function lastTen(){return `<section class="panel"><div class="panel-head"><h2>Iktikaf dan malam terakhir</h2><label class="inline-field"><input type="checkbox" data-action="iktikaf" ${db['iktikaf']?'checked':''}><span>Mode iktikaf</span></label></div><p class="muted small">Mode ini menandai pilihanmu di perangkat ini. Atur waktu layar dan notifikasi perangkat secara mandiri.</p><div class="calendar-strip">${Array.from({length:10},(_,i)=>`<div class="day-cell ${db.iktikafDays?.includes(i+21)?'done':''}"><span>Malam</span><b>${i+21}</b><button class="link-btn" data-action="night" data-value="${i+21}">${db.iktikafDays?.includes(i+21)?'✓ Dicatat':'Tandai'}</button></div>`).join('')}</div></section><div class="section-title"><h2>Jurnal doa khusus</h2></div><section class="panel"><div class="row-actions"><input class="text-input" id="dua-input" placeholder="Doa atau harapan yang ingin kamu panjatkan" maxlength="240"><button class="btn primary" data-action="dua-add">Simpan doa</button></div>${db.duas.length?db.duas.map((d,i)=>`<div class="list-row"><p>${esc(d)}</p><button class="link-btn" data-action="dua-delete" data-value="${i}" aria-label="Hapus doa">Hapus</button></div>`).join(''):'<p class="empty">Doa pribadimu hanya disimpan di perangkat ini.</p>'}</section>`}
    function eid(){return `<div class="grid"><section class="panel span-6"><div class="panel-head"><h2>Panduan Shalat Id</h2><span class="pill">Ringkas</span></div><ol class="muted small" style="padding-left:19px"><li>Awali dengan niat dan takbiratul ihram.</li><li>Takbir tambahan pada rakaat pertama dan kedua mengikuti tuntunan setempat.</li><li>Dengarkan khutbah setelah shalat dan jaga adab silaturahmi.</li></ol><h3>Takbir</h3><p lang="ar" dir="rtl" style="font:22px/1.8 Georgia,serif">اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ لَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ</p><button class="btn" data-action="takbir">Putar panduan suara</button><p class="muted small" style="margin:9px 0 0">Suara menggunakan pembaca teks perangkat jika tersedia.</p></section><section class="panel span-6"><div class="panel-head"><h2>Kartu ucapan</h2></div><label class="field"><span>Nama penerima</span><input type="text" id="greet-name" placeholder="Keluarga dan sahabat"></label><p class="notice" id="greeting" style="margin:12px 0">Selamat Idulfitri. Mohon maaf lahir dan batin. Semoga Allah menerima amal ibadah kita.</p><button class="btn" data-action="copy-greeting">Salin ucapan</button></section></div><div class="section-title"><h2>Silaturahmi dan maaf</h2></div><section class="panel"><div class="row-actions"><input class="text-input" id="family-input" placeholder="Nama keluarga atau sahabat" maxlength="80"><button class="btn primary" data-action="family-add">Tambah</button></div>${db.family.length?db.family.map((f,i)=>`<div class="list-row"><label class="inline-field"><input type="checkbox" data-action="family-check" data-value="${i}" ${f.done?'checked':''}><span>${esc(f.name)}</span></label><button class="link-btn" data-action="family-delete" data-value="${i}">Hapus</button></div>`).join(''):'<p class="empty">Catat orang yang ingin kamu hubungi atau kunjungi.</p>'}</section>`}
    function postRamadan(){return `<section class="panel"><div class="panel-head"><h2>Puasa enam hari Syawal</h2><span class="pill">${db.fasting.syawal.length}/6 hari</span></div><label class="field"><span>Tanggal puasa selesai</span><input type="date" data-action="fast-date" max="${keyOf(new Date())}"></label>${fastingCalendar('syawal')}<div class="progress-track"><i style="width:${Math.min(100,db.fasting.syawal.length/6*100)}%"></i></div><p class="muted small" style="margin:10px 0 0">Boleh dicatat terpisah atau berurutan. Sesuaikan pelaksanaan dengan kondisi dan bimbingan yang kamu ikuti.</p></section><div class="section-title"><h2>Jaga kebiasaan sepanjang tahun</h2></div><section class="panel"><p class="muted small">Tandai kebiasaan hari ini. Catatan ini tidak mengukur nilai dirimu.</p><div class="check-grid">${HABITS.map((h,i)=>taskHTML(h,!!db.habits[`${keyOf(new Date())}-${i}`],'habit',i)).join('')}</div><div class="section-title"><h2>Safarnama</h2></div><div class="notice">Musafir dapat memiliki rukhsah terkait shalat dan puasa berdasarkan ketentuan yang berlaku. Perjalanan, jarak, durasi, dan kondisi tiap orang dapat berbeda; tanyakan kepada ustaz atau otoritas agama tepercaya. Aplikasi ini tidak menetapkan hukum untuk situasi personal.</div><div class="row-actions" style="margin-top:13px"><span class="pill">Jamak</span><span class="pill">Qashar</span><span class="pill">Puasa saat safar</span></div></section>`}
    function plan(){const p=phaseInfo();document.documentElement.dataset.phase=p.key;let content;if(p.key==='prep')content=prepPlan();else if(p.key==='last')content=lastTen()+`<div class="section-title"><h2>Pengingat zakat</h2></div>${zakat()}<div class="section-title"><h2>Safarnama</h2></div>${safarGuide()}`;else if(p.key==='eid')content=eid()+`<div class="section-title"><h2>Puasa Syawal</h2></div>${postRamadan()}`;else if(p.key==='post')content=postRamadan()+`<div class="section-title"><h2>Rapor Ramadhan</h2></div><button class="btn" data-view="report">Lihat evaluasi →</button>`;else content=`<div class="notice">${p.day<=10?'Mulai dengan target ringan dan konsisten.':p.day<=20?'Tinjau progres dan jaga diri dari kelelahan.':'Gunakan ruang malam untuk iktikaf dan doa.'}</div>${p.day<=20?`<div class="section-title"><h2>Progres pertengahan Ramadhan</h2></div><section class="panel"><div class="progress-row"><div class="progress-ring" style="--pct:${monthProgress()}" data-label="${monthProgress()}%"></div><div class="progress-copy"><strong>${monthProgress()}% catatan tersedia</strong><span>Hari dengan jurnal dari ${Math.max(1,p.day)} hari berjalan.</span></div></div><p class="muted small" style="margin:13px 0 0">${monthProgress()<35?'Bila sedang lelah, pilih satu amalan singkat dan istirahat yang cukup.':'Pertahankan ritme yang realistis; tidak perlu mengejar angka.'}</p><button class="btn" data-action="gentle">Tampilkan pengingat lembut</button></section>`:''}${safarGuide()}<div class="section-title"><h2>Hitung zakat</h2></div>${zakat()}`;return shellPage('Rencana fase',p.label,content)}
    function safarGuide(){return `<section class="panel"><div class="panel-head"><h2>Safarnama</h2><span class="pill">Panduan musafir</span></div><p class="muted small">Ringkasan umum, bukan penetapan hukum untuk keadaan tertentu.</p><div class="list-row"><p><strong>Jamak</strong><br><span class="muted small">Menggabungkan dua shalat pada waktu yang dibolehkan sesuai syarat.</span></p></div><div class="list-row"><p><strong>Qashar</strong><br><span class="muted small">Meringkas shalat empat rakaat sesuai ketentuan safar yang diikuti.</span></p></div><div class="list-row"><p><strong>Puasa saat bepergian</strong><br><span class="muted small">Pertimbangkan kondisi perjalanan, kemampuan, dan panduan tepercaya.</span></p></div><p class="notice" style="margin:12px 0 0">Ketentuan dapat berbeda menurut mazhab, jarak, niat menetap, dan kondisi. Konfirmasikan kepada pembimbing agama atau otoritas setempat.</p></section>`}
    function monthProgress(){const start=db.settings.ramadanStart;let n=0,all=0;for(let i=0;i<30;i++){const k=keyPlus(start,i);if(k>keyOf(new Date()))break;all++;if(db.days[k]&&(todayScore(db.days[k])>0||db.days[k].note))n++}return all?Math.round(n/all*100):0}
    function keyPlus(k,n){const d=new Date(`${k}T12:00:00`);d.setDate(d.getDate()+n);return keyOf(d)}
    function report(){const days=Object.entries(db.days).filter(([,r])=>r.prayers.some(Boolean)||r.pages||r.note||Object.values(r.tasks).some(Boolean));const scores=days.map(([,r])=>todayScore(r)),avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;const daily=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=keyOf(d);return{label:d.toLocaleDateString('id-ID',{weekday:'short'}),score:db.days[k]?todayScore(db.days[k]):0}});const pages=days.reduce((a,[,r])=>a+(Number(r.pages)||0),0),sad=days.reduce((a,[,r])=>a+(Number(r.sadaqah)||0),0);const phase=phaseInfo();document.documentElement.dataset.phase=phase.key;return shellPage('Rapor spiritual','Lihat perjalananmu',`<div class="grid"><section class="panel span-4"><div class="eyebrow">Hari tercatat</div><div class="stat-line"><strong>${days.length}</strong><span>hari jurnal</span></div></section><section class="panel span-4"><div class="eyebrow">Rata-rata checklist</div><div class="stat-line"><strong>${avg}%</strong><span>dari jurnal tercatat</span></div></section><section class="panel span-4"><div class="eyebrow">Streak saat ini</div><div class="stat-line"><strong>${streak()}</strong><span>hari beruntun</span></div></section><section class="panel span-8"><div class="panel-head"><h2>Mutabaah 7 hari terakhir</h2><span class="pill">Persentase per hari</span></div><div class="chart">${daily.map(d=>`<div class="chart-col"><b>${d.score}%</b><i style="height:${d.score}%"></i><span>${d.label}</span></div>`).join('')}</div></section><section class="panel span-4"><div class="panel-head"><h2>Akumulasi</h2></div><div class="list-row"><p>Halaman Qur’an</p><strong>${pages}</strong></div><div class="list-row"><p>Sedekah (Rp)</p><strong>${sad.toLocaleString('id-ID')}</strong></div><div class="list-row"><p>Puasa Syawal</p><strong>${db.fasting.syawal.length}/6</strong></div></section><section class="panel span-12"><div class="eyebrow">Refleksi</div><h2>Progres bukan perlombaan.</h2><p class="muted small">Angka di atas hanya ringkasan catatan pribadimu, bukan penilaian kualitas iman atau ibadah. Simpan laporan dengan aman dan tinjau sesuai tujuanmu.</p><button class="btn" data-action="export">Unduh cadangan data</button></section></div>`)}
    function settings(){const p=phaseInfo();document.documentElement.dataset.phase=p.key;let schedule='Jadwal belum dimuat.';try{const saved=JSON.parse(localStorage.getItem('rp-prayer-cache')||'null');if(saved)schedule=`Imsak ${saved.Imsak} · Subuh ${saved.Fajr} · Dzuhur ${saved.Dhuhr} · Ashar ${saved.Asr} · Maghrib ${saved.Maghrib} · Isya ${saved.Isha}\nTanggal ${saved.date||''}. Jadwal dapat berubah; periksa kembali ke sumber setempat.`}catch{}return shellPage('Pengaturan & privasi','Kendali tetap di tanganmu',`<div class="grid"><section class="panel span-7"><div class="panel-head"><h2>Profil dan tanggal</h2></div><div class="form-grid"><label class="field"><span>Nama panggilan</span><input type="text" data-setting="displayName" maxlength="40" value="${esc(db.settings.displayName)}"></label><label class="field"><span>Awal Ramadhan perkiraan</span><input type="date" data-setting="ramadanStart" value="${db.settings.ramadanStart}"></label><label class="field"><span>Nama kota (opsional)</span><input type="text" data-setting="city" value="${esc(db.settings.city)}" placeholder="Untuk label jadwal"></label></div></section><section class="panel span-5"><div class="panel-head"><h2>Jadwal shalat</h2></div><p class="muted small">Ambil jadwal sesuai lokasi melalui layanan AlAdhan. Lokasi hanya digunakan saat kamu menekan tombol dan tidak disimpan oleh RamadhanPro.</p><button class="btn" data-action="location">Gunakan lokasi saat ini</button><div id="prayer-times" class="small muted" style="margin-top:12px;white-space:pre-line">${esc(schedule)}</div></section><section class="panel span-12"><div class="panel-head"><h2>Privasi dan cadangan</h2><span class="pill">Penyimpanan lokal</span></div><p class="muted small">Jurnal dan progres tersimpan di penyimpanan browser perangkat ini. Tidak ada akun, sinkronisasi cloud, atau pengiriman catatan ibadah. Menghapus data browser dapat menghapus catatan.</p><div class="row-actions"><button class="btn primary" data-action="export">Unduh cadangan JSON</button><button class="btn" data-action="import">Pulihkan cadangan</button><button class="btn quiet danger" data-action="reset">Hapus semua data</button><input type="file" id="import-file" accept="application/json" hidden></div></section><section class="panel span-12"><div class="panel-head"><h2>Pengingat</h2></div><p class="muted small">Pengingat waktu shalat dan notifikasi latar belum aktif. Gunakan alarm perangkat atau aplikasi jadwal shalat lokal agar tetap berfungsi saat offline.</p><button class="btn" data-action="notify-test">Minta izin notifikasi browser</button></section></div>`)}
    function render(){const p=phaseInfo();document.documentElement.dataset.phase=p.key;document.getElementById('profile-name').textContent=db.settings.displayName||'Sahabat';document.getElementById('side-nav').innerHTML=navHTML();document.getElementById('mobile-nav').innerHTML=navHTML();const views={home,daily,plan,report,settings};document.getElementById('main').innerHTML=views[view]();}
    function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
    function update(mutator){mutator();save();render()}
    function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download=`ramadhanpro-cadangan-${keyOf(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);notify('Cadangan berhasil diunduh')}
    function addFast(kind,date){if(!date)return;if(!db.fasting[kind].includes(date)){db.fasting[kind].push(date);db.fasting[kind].sort();save();render();notify('Tanggal puasa dicatat')}else notify('Tanggal itu sudah tercatat')}
    async function prayerTimes(){if(!navigator.geolocation){notify('Browser tidak menyediakan lokasi');return}notify('Meminta izin lokasi…');navigator.geolocation.getCurrentPosition(async pos=>{try{const d=new Date(),stamp=Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/1000),url=`https://api.aladhan.com/v1/timings/${stamp}?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&method=20`;const response=await fetch(url);if(!response.ok)throw Error();const json=await response.json(),t=json.data.timings,cache={date:keyOf(new Date()),Imsak:t.Imsak,Fajr:t.Fajr,Dhuhr:t.Dhuhr,Asr:t.Asr,Maghrib:t.Maghrib,Isha:t.Isha};localStorage.setItem('rp-prayer-cache',JSON.stringify(cache));view='home';render();notify('Jadwal lokal berhasil dimuat')}catch{notify('Jadwal tidak tersedia. Periksa koneksi atau coba lagi.')}},()=>notify('Izin lokasi ditolak. Kamu bisa mengatur izin browser.'))}
    document.addEventListener('click',async e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.view){view=target.dataset.view;render();window.scrollTo(0,0);return}const a=target.dataset.action;if(!a)return;const r=dayRecord();if(a==='prayer')update(()=>{const i=Number(target.dataset.value);r.prayers[i]=!r.prayers[i]});else if(a==='water')update(()=>{const i=Number(target.dataset.value);r.water[i]=!r.water[i]});else if(a==='pages-step')update(()=>r.pages=Math.max(0,(Number(r.pages)||0)+Number(target.dataset.value)));else if(a==='fast-date'){addFast('preRamadan',document.querySelector('[data-action="fast-date"]').value)}else if(a==='fast-remove')update(()=>db.fasting[target.dataset.kind]=db.fasting[target.dataset.kind].filter(d=>d!==target.dataset.date));else if(a==='prep')update(()=>{const i=Number(target.dataset.value);db.prepDone=db.prepDone.includes(i)?db.prepDone.filter(v=>v!==i):[...db.prepDone,i]});else if(a==='iktikaf')update(()=>db.iktikaf=!db.iktikaf);else if(a==='night')update(()=>{db.iktikafDays||=[];const n=Number(target.dataset.value);db.iktikafDays=db.iktikafDays.includes(n)?db.iktikafDays.filter(d=>d!==n):[...db.iktikafDays,n]});else if(a==='dua-add'){const input=document.getElementById('dua-input'),value=input.value.trim();if(value)update(()=>db.duas.push(value));else notify('Tulis doa terlebih dahulu')}else if(a==='dua-delete')update(()=>db.duas.splice(Number(target.dataset.value),1));else if(a==='family-add'){const input=document.getElementById('family-input'),name=input.value.trim();if(name)update(()=>db.family.push({name,done:false}));else notify('Tulis nama terlebih dahulu')}else if(a==='family-delete')update(()=>db.family.splice(Number(target.dataset.value),1));else if(a==='copy-greeting'){const name=document.getElementById('greet-name').value.trim(),text=`${name?`Untuk ${name}, `:''}Selamat Idulfitri. Mohon maaf lahir dan batin. Semoga Allah menerima amal ibadah kita.`;try{await navigator.clipboard.writeText(text);notify('Ucapan disalin')}catch{notify(text)}}else if(a==='takbir'){const text='Allahu akbar, Allahu akbar, la ilaha illallah, wallahu akbar. Allahu akbar wa lillahil hamd.';if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}else notify('Pembaca suara tidak tersedia')}else if(a==='gentle')notify('Pilih satu amal kecil, tarik napas, dan beri tubuh waktu untuk beristirahat.');else if(a==='export')exportData();else if(a==='import')document.getElementById('import-file').click();else if(a==='reset'){if(confirm('Hapus seluruh catatan RamadhanPro dari perangkat ini? Tindakan ini tidak dapat dibatalkan.')){localStorage.removeItem(KEY);db=structuredClone(defaults);save();render();notify('Data dihapus')}}else if(a==='location')prayerTimes();else if(a==='install'){if(window.installPrompt){window.installPrompt.prompt();window.installPrompt=null}else notify('Gunakan menu browser “Tambahkan ke layar utama”')}else if(a==='notify-test'){if(!('Notification'in window))notify('Notifikasi tidak didukung browser');else{const permission=await Notification.requestPermission();notify(permission==='granted'?'Izin notifikasi aktif. Pengingat terjadwal belum disiapkan.':'Izin notifikasi tidak diberikan')}}});
    document.addEventListener('change',e=>{const el=e.target,a=el.dataset.action;if(a==='prayer'||a==='task'||a==='fast'||a==='habit'||a==='prep'||a==='water'){const checked=el.checked;update(()=>{const i=Number(el.dataset.value);if(a==='prayer')dayRecord().prayers[i]=checked;else if(a==='task')dayRecord().tasks[i]=checked;else if(a==='fast')dayRecord().fast=checked;else if(a==='water')dayRecord().water[i]=checked;else if(a==='prep')db.prepDone=db.prepDone.includes(i)?db.prepDone.filter(x=>x!==i):[...db.prepDone,i];else db.habits[`${keyOf(new Date())}-${i}`]=checked})}else if(a==='date'){selectedDate=el.value;render()}else if(a==='mood')update(()=>dayRecord().mood=Number(el.value));else if(a==='pages')update(()=>dayRecord().pages=Math.max(0,Number(el.value)||0));else if(a==='juz')update(()=>dayRecord().juz=Math.max(0,Math.min(30,Number(el.value)||0)));else if(a==='sadaqah')update(()=>dayRecord().sadaqah=Math.max(0,Number(el.value)||0));else if(a==='fast-date')addFast(phaseInfo().key==='prep'?'preRamadan':'syawal',el.value);else if(a==='family-check')update(()=>db.family[Number(el.dataset.value)].done=el.checked);else if(a==='note')update(()=>dayRecord().note=el.value);else if(a==='pages-step'){}else if(el.dataset.setting)update(()=>{const key=el.dataset.setting,textFields=['displayName','city','ramadanStart','qadhaDeadline'].includes(key),value=textFields?el.value:el.value===''?0:Number(el.value);db.settings[key]=value;render()})});
    document.addEventListener('input',e=>{const el=e.target,a=el.dataset.action;if(a==='note'){dayRecord().note=el.value;save()}else if(el.dataset.setting&&['displayName','city'].includes(el.dataset.setting)){db.settings[el.dataset.setting]=el.value;save();document.getElementById('profile-name').textContent=el.value||'Sahabat'}});
    document.addEventListener('change',e=>{if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.settings||!data.days)throw Error();if(confirm('Pulihkan cadangan dan ganti data saat ini?')){db={...structuredClone(defaults),...data,settings:{...defaults.settings,...data.settings}};save();render();notify('Cadangan berhasil dipulihkan')}}catch{notify('File cadangan tidak valid')}e.target.value=''};reader.readAsText(file)}});
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.installPrompt=e});
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    render();
  </script>
</body>
